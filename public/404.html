<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>404 — NEBULA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060d1a;
    --accent:#38bdf8;
    --accent-glow:rgba(56,189,248,.32);
    --text:#dce8f5;
    --text-muted:rgba(220,232,245,.5);
    --text-faint:rgba(220,232,245,.18);
    --border:rgba(56,189,248,.12);
    --grad:linear-gradient(135deg,#e0f2fe 0%,#38bdf8 100%);
  }

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }

  /* ── Canvas starfield ── */
  #bg-canvas{
    position:fixed;inset:0;z-index:0;pointer-events:none;
  }

  /* ── Parallax nebula blobs ── */
  #parallax-root{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  }
  .neb-layer{
    position:absolute;border-radius:50%;filter:blur(90px);
    opacity:0;animation:nebFadeIn 3s ease forwards;
    will-change:transform;
  }
  #neb-1{
    width:70vmax;height:70vmax;left:-18vmax;top:10vmax;
    background:radial-gradient(ellipse at center,hsla(220,80%,40%,.55) 0%,hsla(240,70%,30%,.28) 45%,transparent 70%);
    animation-delay:.2s;
  }
  #neb-2{
    width:55vmax;height:55vmax;right:-12vmax;top:-8vmax;
    background:radial-gradient(ellipse at center,hsla(275,75%,45%,.5) 0%,hsla(260,65%,35%,.24) 50%,transparent 72%);
    animation-delay:.5s;
  }
  #neb-3{
    width:48vmax;height:48vmax;left:25vmax;bottom:-10vmax;
    background:radial-gradient(ellipse at center,hsla(195,90%,45%,.38) 0%,hsla(210,80%,35%,.18) 50%,transparent 72%);
    animation-delay:.8s;
  }
  @keyframes nebFadeIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}

  /* ── Card ── */
  .card{
    position:relative;z-index:1;
    text-align:center;
    padding:3rem 2.8rem 2.4rem;
    max-width:420px;
    width:90%;
    background:rgba(6,13,26,.82);
    border:1px solid var(--border);
    border-radius:20px;
    backdrop-filter:blur(28px);
    box-shadow:0 24px 64px rgba(0,0,0,.65), 0 0 0 1px rgba(56,189,248,.04);
    animation:cardIn .65s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(24px) scale(.97);}
    to  {opacity:1;transform:translateY(0)    scale(1);}
  }

  /* ── Glitchy 404 number ── */
  .code{
    font-size:clamp(5rem,18vw,8rem);
    font-weight:800;
    letter-spacing:-.03em;
    line-height:1;
    background:var(--grad);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    position:relative;
    display:inline-block;
    margin-bottom:.55rem;
    animation:glitch 4.5s ease-in-out infinite;
  }
  .code::before,
  .code::after{
    content:'404';
    position:absolute;
    inset:0;
    background:var(--grad);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    opacity:0;
  }
  .code::before{animation:glitchTop 4.5s ease-in-out infinite;}
  .code::after {animation:glitchBot 4.5s ease-in-out infinite;}

  @keyframes glitch{
    0%,90%,100%{transform:none;}
    92%         {transform:skewX(-2deg);}
    94%         {transform:skewX( 2deg) translateX(-2px);}
    96%         {transform:none;}
  }
  @keyframes glitchTop{
    0%,89%,100%{opacity:0;}
    90%         {opacity:.6;transform:translate(-3px,-2px);clip-path:inset(0 0 65% 0);filter:hue-rotate(40deg);}
    92%         {opacity:.6;transform:translate( 3px,-1px);clip-path:inset(0 0 65% 0);filter:hue-rotate(40deg);}
    94%         {opacity:0;}
  }
  @keyframes glitchBot{
    0%,91%,100%{opacity:0;}
    92%         {opacity:.5;transform:translate( 3px, 2px);clip-path:inset(65% 0 0 0);filter:hue-rotate(-40deg);}
    94%         {opacity:.5;transform:translate(-3px, 1px);clip-path:inset(65% 0 0 0);filter:hue-rotate(-40deg);}
    96%         {opacity:0;}
  }

  /* ── Orbit icon ── */
  .orbit-wrap{
    width:72px;height:72px;
    margin:0 auto 1.4rem;
    position:relative;
  }
  .orbit-planet{
    width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#60c8ff,#1a6fa8);
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 18px rgba(56,189,248,.5);
  }
  .orbit-ring{
    position:absolute;inset:0;
    border-radius:50%;
    border:1.5px solid rgba(56,189,248,.25);
    animation:orbitSpin 5s linear infinite;
  }
  .orbit-ring::after{
    content:'';position:absolute;
    width:8px;height:8px;border-radius:50%;
    background:#38bdf8;
    box-shadow:0 0 10px rgba(56,189,248,.8);
    top:-4px;left:50%;transform:translateX(-50%);
  }
  @keyframes orbitSpin{to{transform:rotate(360deg);}}

  /* ── Typography ── */
  h1{
    font-size:1.35rem;font-weight:800;
    margin-bottom:.5rem;
    letter-spacing:-.01em;
  }
  .sub{
    font-size:.82rem;
    color:var(--text-muted);
    line-height:1.65;
    margin-bottom:2rem;
    max-width:300px;
    margin-left:auto;margin-right:auto;
  }

  /* ── CTA button ── */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
    padding:.8rem 2rem;
    background:var(--accent);color:#020d1a;
    font-family:'Inter',sans-serif;font-size:.8rem;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;text-decoration:none;
    border-radius:10px;border:none;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease;
    box-shadow:0 4px 18px rgba(56,189,248,.22);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 24px var(--accent-glow);}
  .btn:active{transform:none;box-shadow:none;}
  .btn svg{flex-shrink:0;}

  /* ── Divider ── */
  .divider{
    width:48px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(56,189,248,.4),transparent);
    margin:1.6rem auto;
  }

  /* ── Footer tag ── */
  .foot{
    margin-top:1.8rem;
    font-size:.54rem;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--text-faint);
  }

  /* ── Scan-line overlay (pure CSS space flavour) ── */
  body::after{
    content:'';
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.04) 2px,
      rgba(0,0,0,.04) 4px
    );
  }

  /* ── Reduced motion ── */
  @media(prefers-reduced-motion:reduce){
    .code,.code::before,.code::after,.orbit-ring,.neb-layer,.card{animation:none!important;}
    .neb-layer{opacity:.6;}
    .card{opacity:1;transform:none;}
  }
</style>
</head>
<body>

<!-- Parallax nebula -->
<div id="parallax-root" aria-hidden="true">
  <div class="neb-layer" id="neb-1"></div>
  <div class="neb-layer" id="neb-2"></div>
  <div class="neb-layer" id="neb-3"></div>
</div>

<!-- Starfield canvas -->
<canvas id="bg-canvas"></canvas>

<!-- 404 card -->
<div class="card" role="main">

  <div class="orbit-wrap" aria-hidden="true">
    <div class="orbit-planet"></div>
    <div class="orbit-ring"></div>
  </div>

  <div class="code" aria-label="404">404</div>

  <h1>Lost in Space</h1>
  <p class="sub">
    The page you're looking for has drifted beyond the observable universe.
    Double-check the URL, or head back to base.
  </p>

  <a href="/main.html" class="btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
      <path d="M9 21V12h6v9"/>
    </svg>
    Return to NEBULA
  </a>

  <div class="divider" aria-hidden="true"></div>
  <p class="foot">© GoatTech Industries</p>

</div>

<script>
/* ── Minimal canvas starfield (self-contained, no imports needed) ── */
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, particles = [];

  function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  for(let i = 0; i < 140; i++){
    particles.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.4 + 0.2,
      a: Math.random() * 0.6 + 0.1,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2,
      dx: (Math.random() - 0.5) * 0.00007,
      dy: (Math.random() - 0.5) * 0.00007,
      color: Math.random() < 0.15
        ? `hsl(${200 + Math.random()*60},80%,85%)`
        : '#fff',
    });
  }

  let shooters = [];
  function spawnShooter(){
    shooters.push({
      x: Math.random() * 0.7, y: Math.random() * 0.4,
      len: Math.random() * 100 + 55,
      speed: Math.random() * 0.015 + 0.009,
      a: 1,
      angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
    });
  }
  setInterval(() => { if(Math.random() < 0.35) spawnShooter(); }, 2200);

  function draw(){
    requestAnimationFrame(draw);
    if(document.hidden) return;
    ctx.clearRect(0, 0, W, H);

    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy;
      if(p.x < 0) p.x = 1; if(p.x > 1) p.x = 0;
      if(p.y < 0) p.y = 1; if(p.y > 1) p.y = 0;
      p.twinklePhase += p.twinkleSpeed;
      ctx.globalAlpha = p.a * (0.6 + 0.4 * Math.sin(p.twinklePhase));
      ctx.fillStyle   = p.color;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    shooters = shooters.filter(s => {
      s.x += Math.cos(s.angle) * s.speed;
      s.y += Math.sin(s.angle) * s.speed;
      s.a -= 0.018;
      if(s.a <= 0) return false;
      const tx = s.x * W, ty = s.y * H;
      const tail = ctx.createLinearGradient(
        tx, ty,
        tx - Math.cos(s.angle) * s.len,
        ty - Math.sin(s.angle) * s.len
      );
      tail.addColorStop(0, `rgba(200,230,255,${s.a})`);
      tail.addColorStop(1, 'transparent');
      ctx.globalAlpha = 1;
      ctx.strokeStyle = tail;
      ctx.lineWidth   = 1.2;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(
        tx - Math.cos(s.angle) * s.len,
        ty - Math.sin(s.angle) * s.len
      );
      ctx.stroke();
      return true;
    });

    ctx.globalAlpha = 1;
  }
  draw();

  /* ── Simple mouse parallax for the three neb-layer divs ── */
  const layers = [
    { el: document.getElementById('neb-1'), sx: 0.018, sy: 0.012 },
    { el: document.getElementById('neb-2'), sx: 0.028, sy: 0.020 },
    { el: document.getElementById('neb-3'), sx: 0.012, sy: 0.018 },
  ];
  let tx = 0, ty = 0, cx = 0, cy = 0;

  window.addEventListener('mousemove', e => {
    tx = (e.clientX / innerWidth  - 0.5) * 2;
    ty = (e.clientY / innerHeight - 0.5) * 2;
  });

  /* Idle sinusoidal drift */
  const t0 = performance.now();
  function parallaxLoop(now){
    requestAnimationFrame(parallaxLoop);
    if(document.hidden) return;
    const idle = {
      x: Math.sin((now - t0) * 0.00018) * 0.18,
      y: Math.cos((now - t0) * 0.00011 + 1.2) * 0.12,
    };
    const fx = tx + idle.x, fy = ty + idle.y;
    cx += (fx - cx) * 0.06;
    cy += (fy - cy) * 0.06;
    layers.forEach(({ el, sx, sy }) => {
      el.style.transform = `translate(${(cx * sx * innerWidth).toFixed(2)}px,${(cy * sy * innerHeight).toFixed(2)}px)`;
    });
  }
  requestAnimationFrame(parallaxLoop);
})();
</script>
</body>
</html>
